name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            generator: Unix Makefiles
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            generator: Unix Makefiles
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            generator: Ninja
          - os: windows-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            generator: MinGW Makefiles
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            generator: Unix Makefiles

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Build GoogleTest
      run: >
        cmake -S ${{ github.workspace }}/extern/googletest
        -B ${{ github.workspace }}/extern/googletest/build
        -G "${{ matrix.generator }}"
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/extern/googletest/build/install
        -DBUILD_GMOCK=OFF
        -Dgtest_force_shared_crt=ON
        -DINSTALL_GTEST=ON
        && cmake --build ${{ github.workspace }}/extern/googletest/build
        --config ${{ matrix.build_type }} --parallel 8
        && cmake --install ${{ github.workspace }}/extern/googletest/build
        --config ${{ matrix.build_type }}

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DBUILD_GTESTS=ON
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -G "${{ matrix.generator }}"
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
